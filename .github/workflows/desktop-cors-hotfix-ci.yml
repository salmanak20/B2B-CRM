name: Desktop CORS Hotfix CI

on:
  push:
    branches:
      - hotfix/desktop-cors-production
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-cors-hotfix-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend auth and CORS regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "sqlite:///:memory:"
      CRM_TEST_DATABASE_URL: "sqlite:///:memory:"
      JWT_SECRET_KEY: ci-only-test-secret-not-for-deployment
      ENVIRONMENT: development
      AUTH_PROVIDER: legacy
      COOKIE_SECURE: "false"
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run focused auth and release-safety tests
        run: >-
          python -m pytest
          tests/test_desktop_cors.py
          tests/test_auth.py
          tests/test_users.py
          tests/test_production_features.py
          tests/test_release_safety.py
          -q

  frontend-verification:
    name: Frontend and desktop checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check out pinned Windows desktop client source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: da81b943accf5e94e5b0073939a9e60cfe7a72bb
          path: desktop-source
          sparse-checkout: stitch_crm_pro_enterprise_suite
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            stitch_crm_pro_enterprise_suite/package-lock.json
            desktop-source/stitch_crm_pro_enterprise_suite/package-lock.json
      - name: Install production-baseline frontend dependencies
        working-directory: stitch_crm_pro_enterprise_suite
        run: npm ci
      - name: Build production-baseline frontend
        working-directory: stitch_crm_pro_enterprise_suite
        run: npm run build
      - name: Check production-baseline frontend
        working-directory: stitch_crm_pro_enterprise_suite
        run: npm run check
      - name: Install pinned desktop client dependencies
        working-directory: desktop-source/stitch_crm_pro_enterprise_suite
        run: npm ci
      - name: Build pinned desktop client frontend
        working-directory: desktop-source/stitch_crm_pro_enterprise_suite
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api/v1
        run: npm run desktop:build
      - name: Check pinned desktop build
        working-directory: desktop-source/stitch_crm_pro_enterprise_suite
        run: npm run check:desktop

  windows-desktop-verification:
    name: Windows Tauri installer build (verification only)
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check out pinned Windows desktop client source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: da81b943accf5e94e5b0073939a9e60cfe7a72bb
          path: desktop-source
          sparse-checkout: stitch_crm_pro_enterprise_suite
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-source/stitch_crm_pro_enterprise_suite/package-lock.json
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30
        with:
          toolchain: 1.90.0
          target: x86_64-pc-windows-msvc
      - name: Install Windows desktop dependencies
        working-directory: desktop-source/stitch_crm_pro_enterprise_suite
        run: npm ci
      - name: Build desktop frontend
        working-directory: desktop-source/stitch_crm_pro_enterprise_suite
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api/v1
        run: npm run desktop:build
      - name: Check desktop build
        working-directory: desktop-source/stitch_crm_pro_enterprise_suite
        run: npm run check:desktop
      - name: Build Windows NSIS installer for verification
        working-directory: desktop-source/stitch_crm_pro_enterprise_suite
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api/v1
        run: npm run tauri -- build --bundles nsis
