services:
  - type: web
    name: b2b-crm-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard to your Supabase PostgreSQL connection string
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: CORS_ORIGINS
        value: '["https://b2-b-crm.vercel.app"]'
      - key: AUTH_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: crm-attachments
      - key: FRONTEND_URL
        value: https://b2-b-crm.vercel.app
      - key: COOKIE_SECURE
        value: 'true'
      - key: ALLOW_SELF_REGISTRATION
        value: 'false'
      - key: DUE_NOTIFICATIONS_ENABLED
        value: 'true'
