<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CRM Pro - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#d8e3fb",
                        "tertiary": "#571ac0",
                        "on-tertiary-fixed-variant": "#5516be",
                        "inverse-on-surface": "#ecf1ff",
                        "on-primary-container": "#dad7ff",
                        "primary-container": "#4f46e5",
                        "on-error-container": "#93000a",
                        "surface-dim": "#cfdaf2",
                        "primary-fixed-dim": "#c3c0ff",
                        "primary": "#3525cd",
                        "error": "#ba1a1a",
                        "surface-container-low": "#f0f3ff",
                        "secondary-container": "#2170e4",
                        "on-surface-variant": "#464555",
                        "tertiary-container": "#6f3dd9",
                        "inverse-surface": "#263143",
                        "surface-tint": "#4d44e3",
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#e2dfff",
                        "on-secondary": "#ffffff",
                        "surface-bright": "#f9f9ff",
                        "surface-container-highest": "#d8e3fb",
                        "on-secondary-fixed": "#001a42",
                        "outline-variant": "#c7c4d8",
                        "on-tertiary-fixed": "#23005c",
                        "surface-container": "#e7eeff",
                        "outline": "#777587",
                        "on-secondary-container": "#fefcff",
                        "surface-container-high": "#dee8ff",
                        "inverse-primary": "#c3c0ff",
                        "on-primary-fixed": "#0f0069",
                        "secondary-fixed-dim": "#adc6ff",
                        "tertiary-fixed-dim": "#d0bcff",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "background": "#f9f9ff",
                        "on-primary-fixed-variant": "#3323cc",
                        "on-error": "#ffffff",
                        "secondary": "#0058be",
                        "tertiary-fixed": "#e9ddff",
                        "on-primary": "#ffffff",
                        "on-background": "#111c2d",
                        "secondary-fixed": "#d8e2ff",
                        "on-secondary-fixed-variant": "#004395",
                        "on-surface": "#111c2d",
                        "on-tertiary-container": "#e3d5ff",
                        "surface": "#f9f9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "lg": "24px",
                        "md": "16px",
                        "gutter": "20px",
                        "container-padding": "24px",
                        "xs": "4px",
                        "unit": "4px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Abstract Glassmorphism Background -->
<div class="absolute inset-0 w-full h-full bg-cover bg-center" data-alt="A pristine, abstract architectural background suitable for an enterprise login screen. The image features soft, flowing geometric shapes in subtle hues of white, light silver, and pale indigo. The lighting is diffused and even, creating a high-key, modern light-mode aesthetic that feels professional, secure, and trustworthy. The composition is minimal, allowing for a clean overlay without visual clutter, emphasizing a premium B2B software environment." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAwKLaugqwjJ2qXd_x81Nue35XDpPES0v1DFtczZfOeXWA44a-WjCIIX1x3bdRhD2l7WRHhXDt5rwg29bkPpnoeKQmV3XKXAwk72pNMazAUjtXjl8ae6cO_nMl0MsrdBGJRZuiJqguiAdBToGpiWcPEJeaxwjQolvcD-N34m8UT6pgNWRFCifSWJN5wz_oRRXrxkZuGEOLvE9hzdt62ISWoaKj5llCg9kkgKwVUIHwoGKEX7Pxd5kJkhw')"></div>
<div class="absolute inset-0 bg-surface/30 backdrop-blur-3xl"></div>
<!-- Login Container -->
<div class="relative z-10 w-full max-w-md mx-auto p-lg sm:p-xl bg-surface/90 backdrop-blur-xl border border-outline-variant/30 rounded-xl shadow-[0px_10px_15px_-3px_rgba(0,0,0,0.05)]">
<!-- Header -->
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center gap-2 mb-md">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">dataset</span>
<span class="font-headline-md text-headline-md font-bold text-primary tracking-tight">CRM Pro</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Welcome back, Salman Studio</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to continue to your dashboard.</p>
</div>
<!-- Form -->
<form class="space-y-md">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Email</label>
<input class="w-full h-10 px-3 py-2 bg-surface-bright border border-outline-variant rounded-md text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="email" name="email" placeholder="Enter your email" required="" type="email" value="admin@salmanstudio.com"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="password">Password</label>
<div class="relative">
<input class="w-full h-10 px-3 py-2 bg-surface-bright border border-outline-variant rounded-md text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<div class="flex items-center justify-between mt-sm mb-lg">
<div class="flex items-center">
<input class="h-4 w-4 text-primary-container focus:ring-primary-container border-outline-variant rounded bg-surface-bright" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant" for="remember-me">
                        Remember me
                    </label>
</div>
<div class="text-sm">
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">
                        Forgot password?
                    </a>
</div>
</div>
<button class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary-container hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container transition-all" type="submit">
                Sign In
            </button>
</form>
<!-- Divider -->
<div class="mt-lg mb-lg">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/50"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface/90 text-on-surface-variant font-body-sm text-body-sm">Or</span>
</div>
</div>
</div>
<!-- SSO Options -->
<div class="space-y-sm">
<button class="w-full flex justify-center items-center gap-2 py-2 px-4 border border-outline-variant rounded-lg bg-surface hover:bg-surface-variant/30 font-label-md text-label-md text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">key</span>
                Sign in with SSO
            </button>
</div>
</div>
<script type="module" src="../js/login.js"></script>
</body></html>
